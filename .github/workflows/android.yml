name: Android Build & Release

on:
  push:
    branches: [ main, "arena/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK with version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "TizNetManager-v${VERSION}-debug.apk"
          ls -lh TizNetManager-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiznet-manager-apk
          path: TizNetManager-*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: tiznet-manager-apk
          path: release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/TizNetManager-*.apk
          generate_release_notes: true
          body: |
            ## TizNet Manager — Android APK

            نسخه اندرویدی مدیریت پنل هیدیفای (پشتیبانی از هیدیفای v11 تا v14).

            ### نصب
            1. فایل `TizNetManager-*.apk` را دانلود کنید
            2. روی گوشی اجازه نصب از منابع ناشناخته را بدهید
            3. فایل را نصب کنید (حداقل اندروید 8.0 / API 26)

            > نکته: این APK با کلید debug امضا شده است. برای استقرار در فروشگاه باید با کلید release اختصاصی امضا شود.
